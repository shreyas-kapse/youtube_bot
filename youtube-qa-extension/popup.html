<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial;
      width: 350px;
      height: 480px;
      display: flex;
      flex-direction: column;
      margin: 0;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: #f5f5f5;
    }

    .msg {
      margin: 8px 0;
      padding: 8px 10px;
      border-radius: 10px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .user {
      background: #007bff;
      color: white;
      align-self: flex-end;
    }

    .bot {
      background: #e0e0e0;
      color: black;
      align-self: flex-start;
    }

    #inputArea {
      display: flex;
      border-top: 1px solid #ccc;
    }

    #query {
      flex: 1;
      padding: 8px;
      border: none;
      outline: none;
    }

    #askBtn {
      padding: 8px;
      border: none;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    button.jump {
      margin-top: 5px;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div id="chat"></div>

<div id="inputArea">
  <input id="query" placeholder="Ask something..." />
  <button id="askBtn">Send</button>
</div>

<script src="popup.js"></script>

</body>
</html>
